services:
  windows-build:
    image: atrinik-windows-mxe
    build:
      context: .
      dockerfile: .devcontainer/windows-cross/Dockerfile
      args:
        MXE_BUILD_JOBS: ${MXE_BUILD_JOBS:-2}
    working_dir: /workspaces/atrinik
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - .:/workspaces/atrinik
    command:
      - bash
      - ./build-windows.sh
