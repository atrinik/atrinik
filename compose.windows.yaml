services:
  windows-build:
    image: ${ATRINIK_WINDOWS_BUILD_IMAGE:-ghcr.io/atrinik/windows-build:mxe}
    working_dir: /workspaces/atrinik
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - .:/workspaces/atrinik
    command:
      - bash
      - ./build-windows.sh
