name: Tagged Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: tagged-release
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate tag
    runs-on: ubuntu-26.04
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      latest: ${{ steps.metadata.outputs.latest }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Validate release tag and commit
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor \
              HEAD refs/remotes/origin/master; then
            echo "Release tag ${RELEASE_TAG} is not on master." >&2
            exit 1
          fi

          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          mapfile -t release_tags < <(git tag --list 'v[0-9]*' --sort=-v:refname)
          latest_tag=${release_tags[0]:-}
          if [[ "${RELEASE_TAG}" == "${latest_tag}" ]]; then
            echo "latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "latest=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"

  linux:
    name: Linux CI
    needs: metadata
    uses: ./.github/workflows/linux-ci.yml
    with:
      ref: ${{ needs.metadata.outputs.tag }}
      package-version: ${{ needs.metadata.outputs.version }}

  windows:
    name: Windows packages
    needs:
      - metadata
      - linux
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          submodules: recursive

      - name: Set image name
        env:
          IMAGE_NAME: windows-build
          IMAGE_VERSION: 0.0.2
        run: |
          echo "WINDOWS_BUILD_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${IMAGE_VERSION}" \
            >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Windows build image
        run: docker pull "${WINDOWS_BUILD_IMAGE}"

      - name: Build Windows client and server packages
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          # The image's default /opt/mxe cache belongs to its build user. Keep
          # ccache under writable /tmp when running as the host runner's UID.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env PATH=/opt/mxe/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env CCACHE_DIR=/tmp/atrinik-ccache \
            --env CCACHE_TEMPDIR=/tmp/atrinik-ccache-tmp \
            --env ATRINIK_PACKAGE_VERSION="${PACKAGE_VERSION}" \
            --volume "${GITHUB_WORKSPACE}:/workspaces/atrinik" \
            --workdir /workspaces/atrinik \
            "${WINDOWS_BUILD_IMAGE}" \
            bash ./build-windows.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mapfile -t packages < <(find build/packages -maxdepth 1 \
            -type f -name '*.zip' -print | sort)
          if [[ "${#packages[@]}" -ne 2 ]]; then
            echo "Expected two Windows packages, found ${#packages[@]}." >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${packages[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --generate-notes \
              --title "Atrinik ${RELEASE_TAG}" \
              "${packages[@]}"
          fi

  server-image:
    name: Linux server image
    needs:
      - metadata
      - linux
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          submodules: recursive

      - name: Set image name
        run: |
          echo "SERVER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/atrinik-server" \
            >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux server image
        env:
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker build \
            --build-arg ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --file Dockerfile.server \
            --label "org.opencontainers.image.revision=${RELEASE_COMMIT}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.title=Atrinik Server" \
            --label "org.opencontainers.image.version=${RELEASE_VERSION}" \
            --tag "${SERVER_IMAGE}:${RELEASE_VERSION}" \
            .

      - name: Publish versioned Linux server image
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: docker push "${SERVER_IMAGE}:${RELEASE_VERSION}"

      - name: Publish latest Linux server image
        if: needs.metadata.outputs.latest == 'true'
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker tag \
            "${SERVER_IMAGE}:${RELEASE_VERSION}" \
            "${SERVER_IMAGE}:latest"
          docker push "${SERVER_IMAGE}:latest"
