name: Tagged Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    name: Validate tag
    runs-on: ubuntu-26.04
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Validate release tag and commit
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor \
              HEAD refs/remotes/origin/master; then
            echo "Release tag ${RELEASE_TAG} is not on master." >&2
            exit 1
          fi

          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"

  linux-build-image:
    name: Linux build image
    needs: metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set image name
        env:
          IMAGE_NAME: linux-build
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" \
            >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.metadata.outputs.version }}
            ${{ env.IMAGE }}:ubuntu-26.04
            ${{ env.IMAGE }}:sha-${{ needs.metadata.outputs.commit }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=linux-ci-image
          cache-to: type=gha,mode=max,scope=linux-ci-image

  linux:
    name: Linux CI
    needs: metadata
    uses: ./.github/workflows/linux-ci.yml
    with:
      ref: ${{ needs.metadata.outputs.tag }}
      package-version: ${{ needs.metadata.outputs.version }}

  windows:
    name: Windows packages
    needs:
      - metadata
      - linux
      - linux-build-image
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Windows cross-compilation image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/windows-cross/Dockerfile
          load: true
          tags: atrinik-windows-mxe:ci
          cache-from: type=gha,scope=windows-mxe
          cache-to: type=gha,mode=max,scope=windows-mxe
          build-args: MXE_BUILD_JOBS=4

      - name: Build Windows client and server packages
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env ATRINIK_PACKAGE_VERSION="${PACKAGE_VERSION}" \
            --volume "${GITHUB_WORKSPACE}:/workspaces/atrinik" \
            --workdir /workspaces/atrinik \
            atrinik-windows-mxe:ci \
            bash ./build-windows.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mapfile -t packages < <(find build/packages -maxdepth 1 \
            -type f -name '*.zip' -print | sort)
          if [[ "${#packages[@]}" -ne 2 ]]; then
            echo "Expected two Windows packages, found ${#packages[@]}." >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${packages[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --generate-notes \
              --title "Atrinik ${RELEASE_TAG}" \
              "${packages[@]}"
          fi
