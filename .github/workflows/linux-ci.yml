name: Linux CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      package-version:
        description: Package version without the leading v
        required: false
        type: string
      gcc_only:
        description: Run only the release-gating GCC build and CTest suites
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify native changes
    if: inputs.gcc_only != true
    runs-on: ubuntu-26.04
    outputs:
      native: ${{ steps.classify.outputs.native }}
      windows: ${{ steps.classify.outputs.windows }}
    steps:
      - name: Select native validation lanes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          client=false
          server=false
          changed_files=()

          if [[ "${EVENT_NAME}" == "pull_request" &&
                "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            changed_output=$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
                --jq '.[].filename'
            )
            if [[ -n "${changed_output}" ]]; then
              mapfile -t changed_files <<< "${changed_output}"
            fi
          else
            # Pushes and reusable callers have no PR-files response. Validate
            # both components unless the caller selected the GCC-only gate.
            client=true
            server=true
          fi

          for path in "${changed_files[@]}"; do
            case "${path}" in
              client/*)
                client=true
                ;;
              arch/*|maps/*|server/*|Dockerfile.server|generate-region-maps.sh|tools/collect.py|tools/utils.py|tools/compilers/*)
                server=true
                ;;
              .devcontainer/*|.github/workflows/linux-ci.yml|.github/workflows/release.yml|CMakeLists.txt|CMakePresets.json|build.config|build.sh|build-windows.sh|cmake/*|common/*|compose.windows.yaml|tests/e2e/*)
                client=true
                server=true
                ;;
            esac
          done

          native=false
          windows='[]'
          if [[ "${client}" == true && "${server}" == true ]]; then
            native=true
            windows='["client","server"]'
          elif [[ "${client}" == true ]]; then
            native=true
            windows='["client"]'
          elif [[ "${server}" == true ]]; then
            native=true
            windows='["server"]'
          fi

          echo "native=${native}" >> "${GITHUB_OUTPUT}"
          echo "windows=${windows}" >> "${GITHUB_OUTPUT}"

  gcc:
    name: GCC build and CTest
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/atrinik/linux-build:0.0.3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      ATRINIK_PACKAGE_VERSION: ${{ inputs.package-version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 250M
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Check C formatting
        run: bash tools/clang-format.sh --check

      - name: Calculate compiler cache key
        id: compiler-cache-key
        run: |
          source_hash=$(
            git ls-files --stage -- \
              CMakeLists.txt build.config CMakePresets.json \
              client cmake common server tests/e2e \
              tools/collect.py tools/compilers tools/utils.py \
              | sha256sum \
              | cut -d ' ' -f 1
          )
          echo "hash=${source_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-${{ steps.compiler-cache-key.outputs.hash }}
          restore-keys: |
            ccache-linux-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Configure
        run: |
          cmake --preset gcc-debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build client and server
        run: cmake --build --preset gcc-debug --parallel

      - name: Run CTest suites
        run: ctest --preset gcc-debug

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

  clang-sanitizers:
    name: Clang ASan/UBSan
    needs: changes
    if: inputs.gcc_only != true && needs.changes.outputs.native == 'true'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/atrinik/linux-build:0.0.3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-clang
      CCACHE_MAXSIZE: 250M
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache-clang
          key: ccache-clang-linux-build-0.0.3-${{ github.sha }}
          restore-keys: |
            ccache-clang-linux-build-0.0.3-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Configure
        run: |
          cmake --preset clang-asan \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build client and server
        run: cmake --build --preset clang-asan --parallel

      - name: Run unit and end-to-end tests
        run: ctest --preset clang-asan -L 'unit|e2e'

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

  windows:
    name: Windows ${{ matrix.component }} (MinGW)
    needs: changes
    if: inputs.gcc_only != true
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component:
          - client
          - server
    steps:
      - name: Skip unaffected package
        if: ${{ !contains(fromJSON(needs.changes.outputs.windows), matrix.component) }}
        run: echo "No ${{ matrix.component }} package inputs changed."

      - name: Check out source
        if: contains(fromJSON(needs.changes.outputs.windows), matrix.component)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        if: contains(fromJSON(needs.changes.outputs.windows), matrix.component)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore client package build
        if: matrix.component == 'client' && contains(fromJSON(needs.changes.outputs.windows), matrix.component)
        uses: actions/cache@v6
        with:
          path: |
            .ccache-windows-client
            build/windows-mxe-release
          key: windows-package-build-0.0.3-client-${{ github.sha }}
          restore-keys: |
            windows-package-build-0.0.3-client-

      - name: Restore server package build
        if: matrix.component == 'server' && contains(fromJSON(needs.changes.outputs.windows), matrix.component)
        uses: actions/cache@v6
        with:
          path: |
            .ccache-windows-server
            build/windows-mxe-server-release
            build/windows-region-map-generator
          key: windows-package-build-0.0.3-server-${{ github.sha }}
          restore-keys: |
            windows-package-build-0.0.3-server-

      - name: Build and verify package with pinned MinGW image
        if: contains(fromJSON(needs.changes.outputs.windows), matrix.component)
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env PATH=/opt/mxe/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env CCACHE_DIR="/workspaces/atrinik/.ccache-windows-${COMPONENT}" \
            --env CCACHE_MAXSIZE=250M \
            --env CCACHE_TEMPDIR=/tmp/atrinik-ccache-tmp \
            --volume "${GITHUB_WORKSPACE}:/workspaces/atrinik" \
            --workdir /workspaces/atrinik \
            ghcr.io/atrinik/windows-build:0.0.3 \
            bash -c \
              'set -euo pipefail
               bash ./build-windows.sh "${1}"
               mapfile -t packages < <(
                 find build/packages -maxdepth 1 -type f \
                   -name "atrinik-${1}-*-windows-x86_64.zip" -print
               )
               if [[ "${#packages[@]}" -ne 1 ]]; then
                 echo "Expected one Windows ${1} package, found ${#packages[@]}." >&2
                 exit 1
               fi
               python3 -m zipfile --test "${packages[0]}"' \
            bash "${COMPONENT}"
