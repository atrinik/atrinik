name: Linux CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      package-version:
        description: Package version without the leading v
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and server tests
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/atrinik/linux-build:ubuntu-26.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      ATRINIK_PACKAGE_VERSION: ${{ inputs.package-version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Check C formatting
        run: bash tools/clang-format.sh --check

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-${{ hashFiles('CMakeLists.txt', 'build.config', 'CMakePresets.json', 'client/**', 'common/**', 'server/**') }}
          restore-keys: |
            ccache-linux-

      - name: Configure
        run: |
          cmake --preset linux-debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build client and server
        run: cmake --build --preset linux-debug --parallel

      - name: Run direct-network end-to-end tests
        run: cmake --build --preset linux-debug --target network-e2e

      - name: Prepare server test runtime
        run: |
          mkdir -p server/lib
          python3 tools/collect.py --dir . --out server/lib
          cp -R server/install_data server/data
          mkdir -p server/data/tmp
          ln -s "${GITHUB_WORKSPACE}/build/linux-debug/server/atrinik-server" \
            server/atrinik-server
          ln -s "${GITHUB_WORKSPACE}/build/linux-debug/server/libplugin_arena.so" \
            server/libplugin_arena.so
          ln -s "${GITHUB_WORKSPACE}/build/linux-debug/server/libplugin_python.so" \
            server/libplugin_python.so

      - name: Run server tests
        run: cmake --build --preset linux-debug --target check

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats
