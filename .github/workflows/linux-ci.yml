name: Linux CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      package-version:
        description: Package version without the leading v
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    name: GCC build and CTest
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/atrinik/linux-build:0.0.3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      ATRINIK_PACKAGE_VERSION: ${{ inputs.package-version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Check C formatting
        run: bash tools/clang-format.sh --check

      - name: Calculate compiler cache key
        id: compiler-cache-key
        run: |
          source_hash=$(
            git ls-files --stage -- \
              CMakeLists.txt build.config CMakePresets.json \
              client cmake common server \
              | sha256sum \
              | cut -d ' ' -f 1
          )
          echo "hash=${source_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-${{ steps.compiler-cache-key.outputs.hash }}
          restore-keys: |
            ccache-linux-

      - name: Configure
        run: |
          cmake --preset gcc-debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build client and server
        run: cmake --build --preset gcc-debug --parallel

      - name: Run CTest suites
        run: ctest --preset gcc-debug

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

  clang-sanitizers:
    name: Clang ASan/UBSan
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/atrinik/linux-build:0.0.3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-clang
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Configure
        run: |
          cmake --preset clang-asan \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build client and server
        run: cmake --build --preset clang-asan --parallel

      - name: Run unit and end-to-end tests
        run: ctest --preset clang-asan -L 'unit|e2e'

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

  windows:
    name: Windows ${{ matrix.component }} (MinGW)
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component:
          - client
          - server
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with pinned MinGW image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env PATH=/opt/mxe/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env CCACHE_DIR=/tmp/atrinik-ccache \
            --env CCACHE_TEMPDIR=/tmp/atrinik-ccache-tmp \
            --volume "${GITHUB_WORKSPACE}:/workspaces/atrinik" \
            --workdir /workspaces/atrinik \
            ghcr.io/atrinik/windows-build:0.0.3 \
            bash -c \
              'x86_64-w64-mingw32.shared-cmake \
                 --no-warn-unused-cli \
                 --preset "windows-mxe-ci-${1}" && \
               cmake --build --preset "windows-mxe-ci-${1}" --parallel' \
            bash "${COMPONENT}"
