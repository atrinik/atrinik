name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-shards:
    name: Test shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          cache-dependency-path: requirements-dev.txt
          python-version: "3.13"
      - name: Install source-search prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version
      - name: Install coverage tooling
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Preflight provenance revision anchors
        run: ./atrinik provenance preflight
      - name: Run measured test shard
        env:
          COVERAGE_FILE: build/ci/shard-${{ matrix.shard }}/.coverage.shard-${{ matrix.shard }}
        run: |
          python3 -m coverage run --parallel-mode -m atrinik_workspace.ci_sharding run \
            --shard-count 3 \
            --shard-index "${{ matrix.shard }}" \
            --weights ci/test-timing-weights.json \
            --manifest "build/ci/shard-${{ matrix.shard }}/shard-${{ matrix.shard }}-manifest.json" \
            --timings "build/ci/shard-${{ matrix.shard }}/shard-${{ matrix.shard }}-timings.json" \
            --durations 50
      - name: Retain shard coverage and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-shard-${{ matrix.shard }}
          path: build/ci/shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native-windows-smoke:
    name: Native Windows wrapper smoke
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          cache-dependency-path: requirements-dev.txt
          python-version: "3.13"
      - name: Install coverage tooling
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate native Windows CLI import and manifest
        shell: pwsh
        run: |
          python .\atrinik --help | Out-Null
          python .\atrinik manifest validate
      - name: Initialize the complete Classic cohort
        shell: python
        env:
          ATRINIK_CI_READ_TOKEN: ${{ github.token }}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import textwrap

          # Public Git LFS may challenge for credentials during batch downloads.
          # Keep the read-only job token out of Git config, command lines and disk.
          helper_source = textwrap.dedent('''\
              import os
              import sys

              if sys.argv[1:] != ["get"]:
                  raise SystemExit(0)
              fields = {}
              for line in sys.stdin:
                  line = line.rstrip("\\n")
                  if not line:
                      break
                  key, separator, value = line.partition("=")
                  if not separator:
                      raise SystemExit(0)
                  # Git LFS sends repeated credential-protocol array metadata.
                  if key in ("capability[]", "wwwauth[]", "state[]"):
                      continue
                  if key in fields:
                      raise SystemExit(0)
                  fields[key] = value
              paths = {"atrinik/content.git", "atrinik/sound.git"}
              paths |= {path + "/info/lfs" for path in paths}
              if (fields.get("protocol") != "https"
                      or fields.get("host") != "github.com"
                      or fields.get("path") not in paths
                      or fields.get("username", "x-access-token") != "x-access-token"):
                  raise SystemExit(0)
              token = os.environ.get("ATRINIK_CI_READ_TOKEN", "")
              if token and not any(char in token for char in "\\r\\n"):
                  sys.stdout.write("username=x-access-token\\npassword=" + token + "\\n\\n")
              ''')
          with tempfile.TemporaryDirectory(prefix="atrinik-ci-git-") as temporary:
              helper = Path(temporary) / "credential.py"
              helper.write_text(helper_source, encoding="utf-8")
              environment = dict(os.environ)
              environment.update({
                  "ATRINIK_CI_GIT_HELPER": helper.as_posix(),
                  "ATRINIK_CI_PYTHON": Path(sys.executable).as_posix(),
                  "GIT_TERMINAL_PROMPT": "0",
                  "GIT_CONFIG_COUNT": "3",
                  "GIT_CONFIG_KEY_0": "credential.helper",
                  "GIT_CONFIG_VALUE_0": "",
                  "GIT_CONFIG_KEY_1": "credential.useHttpPath",
                  "GIT_CONFIG_VALUE_1": "true",
                  "GIT_CONFIG_KEY_2": "credential.helper",
                  "GIT_CONFIG_VALUE_2": '!"$ATRINIK_CI_PYTHON" "$ATRINIK_CI_GIT_HELPER"',
              })
              result = subprocess.run(
                  [sys.executable, "atrinik", "init", "--with", "classic", "--jobs", "4"],
                  env=environment,
              )
          raise SystemExit(result.returncode)
      - name: Validate native Windows status, profile, and worktree paths
        shell: pwsh
        run: |
          $status = python .\atrinik status --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = $status | ConvertFrom-Json
          if (($rows | Where-Object { -not $_.initialized }).Count -ne 0) {
            throw "native Windows initialization left an uninitialized checkout"
          }
          python .\atrinik profile show classic --json | Out-Null
          python .\atrinik worktree list --wrapper-self --json | Out-Null
      - name: Verify deliberate capability results remain stable
        shell: pwsh
        run: |
          function Invoke-CapabilityCommand {
            param(
              [string]$Label,
              [string[]]$Arguments
            )
            $message = (& python .\atrinik @Arguments 2>&1 | Out-String)
            $status = $LASTEXITCODE
            Write-Host "$Label exit status: $status"
            Write-Host $message
            if ($status -ne 1) { throw "native Windows $Label did not return capability status 1" }
            if ($message -notmatch "unavailable on native Windows") {
              throw "native Windows $Label capability diagnostic is missing"
            }
          }
          Invoke-CapabilityCommand "up" @("up")
          Invoke-CapabilityCommand "build" @("build", "all", "--profile", "classic")
          $global:LASTEXITCODE = 0

  integration:
    name: Integration validation
    if: always()
    needs: test-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          cache-dependency-path: requirements-dev.txt
          python-version: "3.13"
      - name: Install coverage tooling
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Download shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: integration-shard-*
          path: build/ci/shards
          merge-multiple: true
      - name: Require passing test shards
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARD_RESULT" = success
      - name: Verify complete test discovery
        run: |
          python3 -m atrinik_workspace.ci_sharding verify \
            --shard-count 3 \
            --weights ci/test-timing-weights.json \
            --manifests build/ci/shards \
            --output build/ci/discovery-manifest.json
      - name: Combine and report branch coverage
        run: |
          python3 -m coverage combine build/ci/shards
          python3 -m coverage report --show-missing
          python3 -m coverage xml
      - name: Compile Python sources
        run: python3 -m compileall -q atrinik atrinik_workspace tests
      - name: Validate guidance inventory
        run: python3 -m atrinik_workspace.guidance_inventory --check
      - name: Validate MCP contract
        run: python3 -m atrinik_workspace.mcp_contract validate
      - name: Validate component manifest
        run: ./atrinik manifest validate
      - name: Validate provenance registry
        run: ./atrinik provenance validate
      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage.xml
          use_oidc: true
