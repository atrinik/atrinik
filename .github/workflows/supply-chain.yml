name: Dependency diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Optional dependency diagnostics
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Initialize complete audit profiles
        run: ./atrinik init --with classic
      - name: Inspect dependency catalog
        run: |
          ./atrinik supply-chain validate
          ./atrinik supply-chain audit --profile default
          ./atrinik supply-chain audit --profile classic
          ./atrinik supply-chain versions \
            --output build/supply-chain/versions.json
          ./atrinik supply-chain report --format licenses \
            --profile default \
            --output build/supply-chain/default/licenses.md
          ./atrinik supply-chain report --format cyclonedx \
            --profile default \
            --output build/supply-chain/default/cyclonedx.json
          ./atrinik supply-chain report --format spdx \
            --profile default \
            --output build/supply-chain/default/spdx.json
          ./atrinik supply-chain report --format licenses \
            --profile classic \
            --output build/supply-chain/classic/licenses.md
          ./atrinik supply-chain report --format cyclonedx \
            --profile classic \
            --output build/supply-chain/classic/cyclonedx.json
          ./atrinik supply-chain report --format spdx \
            --profile classic \
            --output build/supply-chain/classic/spdx.json
      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: atrinik-supply-chain
          path: build/supply-chain
          if-no-files-found: warn
