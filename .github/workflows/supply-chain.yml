name: Supply chain

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Organization dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/client
          path: client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/server
          path: server
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/protocol
          path: protocol
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/editor
          path: editor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/renderer
          path: renderer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/content-toolkit
          path: content-toolkit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/website
          path: website
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/classic
          path: classic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/content
          path: content
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/content
          ref: 1.x
          path: content-1x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/sound
          path: sound
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/resources
          path: resources
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/tools
          path: tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/metaserver-worker
          path: metaserver-worker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/devcontainer
          path: devcontainer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: atrinik/github-settings
          path: github-settings
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Audit dependency ownership
        run: |
          ./atrinik supply-chain validate
          ./atrinik supply-chain audit --profile default
          ./atrinik supply-chain audit --profile classic
          ./atrinik supply-chain versions \
            --output build/supply-chain/versions.json
          ./atrinik supply-chain report --format licenses \
            --profile default \
            --output build/supply-chain/default/licenses.md
          ./atrinik supply-chain report --format cyclonedx \
            --profile default \
            --output build/supply-chain/default/cyclonedx.json
          ./atrinik supply-chain report --format spdx \
            --profile default \
            --output build/supply-chain/default/spdx.json
          ./atrinik supply-chain report --format licenses \
            --profile classic \
            --output build/supply-chain/classic/licenses.md
          ./atrinik supply-chain report --format cyclonedx \
            --profile classic \
            --output build/supply-chain/classic/cyclonedx.json
          ./atrinik supply-chain report --format spdx \
            --profile classic \
            --output build/supply-chain/classic/spdx.json
      - name: Upload supply-chain reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atrinik-supply-chain
          path: build/supply-chain
          if-no-files-found: error
