# Advisory where this workflow exists on the relevant PR/merge revision.
# Before merge, Codex reads the latest current-HEAD job summary even if a bot
# comment exists; fix actionable introduced risk or record explicit maintainer
# acceptance of existing risk. This workflow is not a merge gate.
name: Dependency review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        id: dependency_review
        timeout-minutes: 5
        continue-on-error: true
        with:
          fail-on-severity: low
          fail-on-scopes: runtime,development,unknown
          warn-only: true
          # License metadata only; repository license compatibility rules still apply.
          license-check: true
          comment-summary-in-pr: always
          show-openssf-scorecard: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
      - name: Report advisory review failures
        if: ${{ !cancelled() && steps.dependency_review.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: python
        run: |
          import json
          import os
          import re
          import signal
          import urllib.error
          import urllib.request

          MARKER = '<!-- dependency-review-pr-comment-marker -->'
          NOTICE = ('Dependency review needs attention: the action reported a failure. '
                    'Inspect the available report, annotations, and logs. '
                    'An absent report means the result is unknown, not clean.')


          def summary(text):
              print('::warning::' + text, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
                  stream.write('\n' + text + '\n')


          class Stop(Exception):
              pass


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise Stop('API redirect refused; PR comment was not refreshed.')


          def report():
              summary(NOTICE)  # Preserve visible evidence before any API operation.
              env = os.environ
              repo, number, head = env['GITHUB_REPOSITORY'], env['PR_NUMBER'], env['PR_HEAD_SHA']
              run, attempt = env['GITHUB_RUN_ID'], env['GITHUB_RUN_ATTEMPT']
              base_ref, base_sha = env['PR_BASE_REF'], env['PR_BASE_SHA']
              if (env['GITHUB_API_URL'] != 'https://api.github.com'
                      or env['GITHUB_SERVER_URL'] != 'https://github.com'
                      or env['GITHUB_EVENT_NAME'] != 'pull_request'
                      or not re.fullmatch(r'atrinik/[A-Za-z0-9_.-]+', repo)
                      or not all(re.fullmatch(r'[1-9][0-9]*', value) for value in (number, run, attempt))
                      or not re.fullmatch(r'[0-9a-f]{40}', head)
                      or not re.fullmatch(r'[0-9a-f]{40}', base_sha)
                      or not 1 <= len(base_ref) <= 1024
                      or re.search(r'[\x00-\x1f\x7f-\x9f]', base_ref)):
                  raise Stop('Invalid reporting context; PR comment was not refreshed.')
              run_url = f'https://github.com/{repo}/actions/runs/{run}/attempts/{attempt}'
              body = (f'## Dependency review needs attention\n\n{NOTICE}\n\n'
                      f'PR head: `{head}`\n\n[Current run summary and logs]({run_url})\n\n{MARKER}')
              summary(f'Review head `{head}`: {run_url}. Always inspect the latest run for the current PR head.')
              base = f'https://api.github.com/repos/{repo}'
              comments_url = f'{base}/issues/{number}/comments'
              opener = urllib.request.build_opener(NoRedirect())

              def api(method, url, data=None):
                  request = urllib.request.Request(url, method=method,
                      data=None if data is None else json.dumps(data).encode('utf-8'),
                      headers={'Authorization': 'Bearer ' + env['GITHUB_TOKEN'],
                               'Accept': 'application/vnd.github+json',
                               'Content-Type': 'application/json',
                               'X-GitHub-Api-Version': '2022-11-28'})
                  with opener.open(request, timeout=10) as response:
                      raw = response.read(8 * 1024 * 1024 + 1)
                      if len(raw) > 8 * 1024 * 1024:
                          raise Stop('API response exceeded the reporting bound; PR comment was not refreshed.')
                      return json.loads(raw), response.headers.get('Link', '')

              def owned(comment):
                  return (comment['user']['login'] == 'github-actions[bot]'
                          and comment['user']['type'] == 'Bot'
                          and comment['body'].count(MARKER) == 1
                          and comment['body'].rstrip().endswith(MARKER))

              repository, _ = api('GET', base)
              repository_id = repository['id']
              if (repository['full_name'] != repo
                      or type(repository_id) is not int or repository_id <= 0):
                  raise Stop('Repository identity mismatch; PR comment was not refreshed.')
              numeric_comments_url = f'https://api.github.com/repositories/{repository_id}/issues/{number}/comments'
              comment_routes = (comments_url, numeric_comments_url)
              candidates, seen = [], set()
              for page in range(1, 11):
                  comments, links = api('GET', f'{comments_url}?per_page=100&page={page}')
                  if not isinstance(comments, list) or len(comments) > 100:
                      raise Stop('Invalid comment pagination; PR comment was not refreshed.')
                  relations = {}
                  for link in links.split(',') if links else []:
                      match = re.fullmatch(r'\s*<([^>]+)>;\s*rel="(next|prev|first|last)"\s*', link)
                      if not match or match[2] in relations:
                          raise Stop('Invalid comment pagination; PR comment was not refreshed.')
                      if not any(re.fullmatch(re.escape(route) + r'\?per_page=100&page=[1-9][0-9]*', match[1]) for route in comment_routes):
                          raise Stop('Unexpected pagination destination; PR comment was not refreshed.')
                      relations[match[2]] = match[1]
                  for relation, destination in relations.items():
                      target_page = int(destination.rsplit('=', 1)[1])
                      if ((relation == 'first' and target_page != 1)
                              or (relation == 'prev' and target_page != page - 1)
                              or (relation == 'last' and (target_page < page or (target_page > page and 'next' not in relations)))):
                          raise Stop('Inconsistent comment pagination; PR comment was not refreshed.')
                  if 'next' in relations and (len(comments) != 100 or int(relations['next'].rsplit('=', 1)[1]) != page + 1):
                      raise Stop('Inconsistent comment pagination; PR comment was not refreshed.')
                  for comment in comments:
                      cid = comment['id']
                      if type(cid) is not int or cid <= 0 or cid in seen or not isinstance(comment['body'], str):
                          raise Stop('Invalid or repeated comment; PR comment was not refreshed.')
                      seen.add(cid)
                      if MARKER in comment['body']:
                          if not owned(comment):
                              raise Stop('Ambiguous dependency review marker; PR comment was not refreshed.')
                          candidates.append(comment)
                  # A full page always requires another request, even without Link.
                  if len(comments) < 100:
                      break
              else:
                  raise Stop('Comment pagination bound reached; PR comment was not refreshed.')
              if len(candidates) > 1:
                  raise Stop('Duplicate dependency review comments; PR comment was not refreshed.')
              if candidates:
                  candidate = candidates[0]
                  target = f"{base}/issues/comments/{candidate['id']}"
                  fresh, _ = api('GET', target)

                  def identity(comment):
                      user = comment['user']
                      if (type(comment['id']) is not int or comment['id'] <= 0
                              or not isinstance(comment['body'], str)
                              or type(user['id']) is not int or user['id'] <= 0
                              or user['login'] != 'github-actions[bot]' or user['type'] != 'Bot'
                              or not isinstance(comment['updated_at'], str)
                              or not re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z', comment['updated_at'])
                              or comment['issue_url'] not in tuple(route.removesuffix('/comments') for route in comment_routes)):
                          raise Stop('Invalid dependency review comment identity; PR comment was not refreshed.')
                      return (comment['id'], comment['body'], user['id'], user['login'],
                              user['type'], comment['updated_at'], comment['issue_url'])

                  if identity(fresh) != identity(candidate) or not owned(fresh):
                      raise Stop('Dependency review comment changed; PR comment was not refreshed.')
              fresh_pr, _ = api('GET', f'{base}/pulls/{number}')
              if (fresh_pr['number'] != int(number)
                      or fresh_pr['base']['repo']['full_name'] != repo
                      or fresh_pr['base']['ref'] != base_ref
                      or fresh_pr['base']['sha'] != base_sha
                      or fresh_pr['head']['sha'] != head):
                  raise Stop('PR head or base changed; stale run did not refresh the PR comment.')
              api('PATCH' if candidates else 'POST', target if candidates else comments_url, {'body': body})


          def main():
              def deadline(signum, frame):
                  raise Stop('Reporting deadline reached; inspect the run summary for current evidence.')
              signal.signal(signal.SIGALRM, deadline)
              signal.alarm(90)
              try:
                  report()
              except Stop as error:
                  summary(str(error))  # Only fixed, locally defined messages.
              except urllib.error.HTTPError as error:
                  error.close()
                  summary('PR comment could not be refreshed (API permission denied).' if error.code == 403
                          else 'PR comment could not be refreshed (API request failed).')
              except Exception:
                  summary('PR comment could not be refreshed (reporting or network error). Inspect the current run summary.')
              finally:
                  signal.alarm(0)


          if __name__ == '__main__':
              main()
      # The pinned action's >1 MiB report artifact expires after one day.
      # Runner 2.337.0 (397b032cbf865e9c3ddfab89d533ec19325e1273)
      # FileCommandManager.cs masks summaries per CR/LF line after the 1 MiB check.
      # Preserve those masking units; never upload the raw workspace report.
      - name: Prepare oversized dependency report
        id: report_parts
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: python
        run: |
          import os
          from pathlib import Path
          import re
          import stat

          LIMIT = 1024 * 1024
          PARTS = 16


          def read_regular(path, bound):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(descriptor, 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  if not stat.S_ISREG(info.st_mode) or info.st_size > bound:
                      raise ValueError('Report file type or size is outside the retention bound.')
                  data = stream.read(bound + 1)
                  if len(data) > bound:
                      raise ValueError('Report read exceeded the retention bound.')
                  return data


          def plan_parts(data):
              # Match StreamReader.ReadLine: CR, LF, or CRLF only. Other Unicode
              # separators remain within the same masking unit. Strip only the initial BOM.
              text = data.decode('utf-8-sig')
              lines = re.split(r'\r\n|\r|\n', text)
              if lines[-1] == '':
                  lines.pop()
              heading = b'## Dependency review report part 01\n\n'
              chunks, chunk = [], bytearray(heading)
              for line in lines:
                  encoded = line.encode('utf-8') + b'\n'
                  if len(heading) + len(encoded) > LIMIT:
                      raise ValueError('A complete report line exceeds the summary limit.')
                  if len(chunk) + len(encoded) > LIMIT:
                      chunks.append(bytes(chunk))
                      if len(chunks) >= PARTS:
                          raise ValueError('The complete report exceeds the part-count bound.')
                      heading = f'## Dependency review report part {len(chunks) + 1:02d}\n\n'.encode()
                      chunk = bytearray(heading)
                  chunk.extend(encoded)
              chunks.append(bytes(chunk))
              return chunks


          def notice():
              message = ('The complete oversized dependency report could not be safely retained. '
                         'Inspect the available action report, annotations, and logs. '
                         'Missing report evidence means the result is unknown, not clean.')
              print('::warning::' + message, flush=True)
              Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(message + '\n', encoding='utf-8')


          def main():
              count = 0
              try:
                  report = Path(os.environ['GITHUB_WORKSPACE']) / 'summary.md'
                  try:
                      data = read_regular(report, PARTS * LIMIT)
                  except FileNotFoundError:
                      # The pinned action creates this file only for oversized reports.
                      return
                  if len(data) <= LIMIT:
                      return
                  chunks = plan_parts(data)  # Validate the entire report before publishing any part.
                  directory = Path(os.environ['RUNNER_TEMP']) / 'dependency-review-report-parts'
                  directory.mkdir(mode=0o700)
                  for number, chunk in enumerate(chunks, 1):
                      with (directory / f'part-{number:02d}.md').open('xb') as stream:
                          os.chmod(stream.name, 0o600)
                          stream.write(chunk)
                  count = len(chunks)
              except Exception:
                  notice()  # Do not print exception text or report data.
              finally:
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write(f'count={count}\n')


          if __name__ == '__main__':
              main()
      - name: Mask dependency report part 01
        if: ${{ always() && steps.report_parts.outputs.count >= 1 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '1'
        shell: python
        run: &mask_dependency_report_part |
          import os
          from pathlib import Path
          import stat

          number = int(os.environ['REPORT_PART'])
          directory = Path(os.environ['RUNNER_TEMP']) / 'dependency-review-report-parts'
          path = directory / f'part-{number:02d}.md'
          try:
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(descriptor, 'rb') as source:
                  info = os.fstat(source.fileno())
                  if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 1024 * 1024:
                      raise ValueError()
                  data = source.read(1024 * 1024 + 1)
                  if not 0 < len(data) <= 1024 * 1024:
                      raise ValueError()
              summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
              summary.write_bytes(data)
              # The runner masks this exact file after the step finishes.
              (directory / f'scrubbed-{number:02d}.path').write_text(str(summary) + '-scrubbed', encoding='utf-8')
          except Exception:
              print('::warning::A dependency report part is unavailable; complete report evidence is unknown.', flush=True)
      - name: Mask dependency report part 02
        if: ${{ always() && steps.report_parts.outputs.count >= 2 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '2'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 03
        if: ${{ always() && steps.report_parts.outputs.count >= 3 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '3'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 04
        if: ${{ always() && steps.report_parts.outputs.count >= 4 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '4'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 05
        if: ${{ always() && steps.report_parts.outputs.count >= 5 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '5'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 06
        if: ${{ always() && steps.report_parts.outputs.count >= 6 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '6'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 07
        if: ${{ always() && steps.report_parts.outputs.count >= 7 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '7'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 08
        if: ${{ always() && steps.report_parts.outputs.count >= 8 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '8'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 09
        if: ${{ always() && steps.report_parts.outputs.count >= 9 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '9'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 10
        if: ${{ always() && steps.report_parts.outputs.count >= 10 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '10'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 11
        if: ${{ always() && steps.report_parts.outputs.count >= 11 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '11'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 12
        if: ${{ always() && steps.report_parts.outputs.count >= 12 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '12'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 13
        if: ${{ always() && steps.report_parts.outputs.count >= 13 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '13'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 14
        if: ${{ always() && steps.report_parts.outputs.count >= 14 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '14'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 15
        if: ${{ always() && steps.report_parts.outputs.count >= 15 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '15'
        shell: python
        run: *mask_dependency_report_part
      - name: Mask dependency report part 16
        if: ${{ always() && steps.report_parts.outputs.count >= 16 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART: '16'
        shell: python
        run: *mask_dependency_report_part
      - name: Assemble runner-masked dependency report
        if: ${{ always() && steps.report_parts.outputs.count > 0 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REPORT_PART_COUNT: ${{ steps.report_parts.outputs.count }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import stat

          LIMIT = 1024 * 1024
          try:
              count = int(os.environ['REPORT_PART_COUNT'])
              if not 1 <= count <= 16:
                  raise ValueError()
              directory = Path(os.environ['RUNNER_TEMP']) / 'dependency-review-report-parts'
              command_directory = Path(os.environ['GITHUB_STEP_SUMMARY']).parent
              chunks = []
              for number in range(1, count + 1):
                  record = directory / f'scrubbed-{number:02d}.path'
                  descriptor = os.open(record, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(descriptor, 'rb') as stream:
                      info = os.fstat(stream.fileno())
                      if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 4096:
                          raise ValueError()
                      recorded = stream.read(4097)
                      if not 0 < len(recorded) <= 4096:
                          raise ValueError()
                      path = Path(recorded.decode('utf-8'))
                  if (path.parent != command_directory or not path.name.startswith('step_summary_')
                          or not path.name.endswith('-scrubbed')):
                      raise ValueError()
                  descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(descriptor, 'rb') as stream:
                      info = os.fstat(stream.fileno())
                      if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 3 * LIMIT:
                          raise ValueError()
                      data = stream.read(3 * LIMIT + 1)
                      if not 0 < len(data) <= 3 * LIMIT:
                          raise ValueError()
                      data.decode('utf-8')
                      heading = f'## Dependency review report part {number:02d}\n\n'.encode()
                      if not data.startswith(heading) or len(data) <= len(heading):
                          raise ValueError()
                      chunks.append(data)
              # Publish only after all exact expected runner-masked parts are available.
              destination = Path(os.environ['RUNNER_TEMP']) / 'dependency-review-retained'
              destination.mkdir(mode=0o700)
              temporary = destination / '.report.tmp'
              with temporary.open('xb') as report:
                  for chunk in chunks:
                      report.write(chunk)
              temporary.rename(destination / 'report.md')
              message = ('The complete oversized dependency report is prepared as runner-masked report.md '
                         'for the seven-day artifact upload. Confirm the retention step succeeded before relying on the artifact.')
          except Exception:
              message = ('The complete oversized dependency report could not be safely retained. '
                         'Inspect the available action report, annotations, and logs. '
                         'Missing report evidence means the result is unknown, not clean.')
              print('::warning::' + message, flush=True)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(message + '\n', encoding='utf-8')
      - name: Retain dependency review job summary
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-review-job-summary-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Retain only runner-masked job summaries and their ordered report assembly.
          path: |
            ${{ runner.temp }}/_runner_file_commands/step_summary_*-scrubbed
            ${{ runner.temp }}/dependency-review-retained/report.md
          retention-days: 7
          if-no-files-found: warn
