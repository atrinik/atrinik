name: Metaserver Worker

on:
  push:
    branches:
      - master
    paths:
      - "metaserver/worker/**"
      - "client/schemas/Atrinik-ADS-7.xsd"
      - ".github/workflows/metaserver-worker.yml"
  pull_request:
    branches:
      - master
    paths:
      - "metaserver/worker/**"
      - "client/schemas/Atrinik-ADS-7.xsd"
      - ".github/workflows/metaserver-worker.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for Worker source
        id: worker
        run: |
          if [[ -f metaserver/worker/package-lock.json ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Metaserver Worker source is not present in this revision."
          fi

      - uses: actions/setup-node@v6
        if: steps.worker.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: metaserver/worker/package-lock.json

      - name: Install XML schema validator
        if: steps.worker.outputs.available == 'true'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install Worker dependencies
        if: steps.worker.outputs.available == 'true'
        working-directory: metaserver/worker
        run: npm ci

      - name: Validate Worker
        if: steps.worker.outputs.available == 'true'
        working-directory: metaserver/worker
        run: npm run check
