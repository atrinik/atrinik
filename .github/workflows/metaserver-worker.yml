name: Metaserver Worker

on:
  push:
    paths:
      - "metaserver/worker/**"
      - "client/schemas/Atrinik-ADS-7.xsd"
      - ".github/workflows/metaserver-worker.yml"
  pull_request:
    paths:
      - "metaserver/worker/**"
      - "client/schemas/Atrinik-ADS-7.xsd"
      - ".github/workflows/metaserver-worker.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metaserver/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: metaserver/worker/package-lock.json
      - name: Install XML schema validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - run: npm run check
