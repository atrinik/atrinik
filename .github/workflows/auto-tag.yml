name: Auto Tag

on:
  pull_request_target:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag merged pull request
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # This write-capable workflow checks out only the trusted base branch.
      # The event's merge commit is validated against that branch below before
      # it is read or tagged.
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Create merge tag
        id: tag
        env:
          COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ ! "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid merged commit SHA: ${COMMIT_SHA}" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor \
              "${COMMIT_SHA}" refs/remotes/origin/master; then
            echo "Merged commit ${COMMIT_SHA} is not on master." >&2
            exit 1
          fi

          base_version=$(git show "${COMMIT_SHA}:build.config" | sed -n \
            's/^set(PACKAGE_VERSION "\([0-9][0-9]*\.[0-9][0-9]*\)".*$/\1/p' \
          )
          if [[ -z "${base_version}" ]]; then
            echo "Could not read a MAJOR.MINOR release line from build.config." >&2
            exit 1
          fi

          base_tag="v${base_version}"
          patch=-1
          while IFS= read -r existing_tag; do
            existing_patch=${existing_tag#"${base_tag}."}
            if [[ ! "${existing_patch}" =~ ^[0-9]+$ ]]; then
              continue
            fi

            existing_patch=$((10#${existing_patch}))
            if [[ "${existing_patch}" -gt "${patch}" ]]; then
              patch=${existing_patch}
            fi
          done < <(git tag --list "${base_tag}.*")
          patch=$((patch + 1))
          tag="${base_tag}.${patch}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${COMMIT_SHA}" -m "Atrinik ${tag}"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  release:
    name: Queue build and publish release
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref master \
            --field "tag=${RELEASE_TAG}"
