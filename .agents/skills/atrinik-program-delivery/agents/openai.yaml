interface:
  display_name: "Atrinik Program Delivery"
  short_description: "Deliver ordered Atrinik programs through merge gates"
  default_prompt: "Use $atrinik-program-delivery to deliver this Atrinik master issue as one durable objective across ordered child work, iterative leaf and program-wide review/fix cycles, current-base validation, and explicit maintainer merge gates. After an exact leaf ledger records program authority, you may assign and update tracking, push ordinary branches, create issue-mode draft PRs, update only ledger-bound PRs, and mark drafts ready after exit conditions. Bind the one rolling master comment and any genuinely missing child create/link through the ignored machine-readable program ledger before publication. Keep incidental issues read-only; do not publish issue or master comments or create/link children without a program-level ledger, force-push, merge, close issues, bypass policy, destructively reset, or apply cleanup."
policy:
  allow_implicit_invocation: false
