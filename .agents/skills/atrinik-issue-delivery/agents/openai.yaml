interface:
  display_name: "Atrinik Issue or PR Delivery"
  short_description: "Deliver Atrinik issues, PRs, and ledger lifecycles"
  default_prompt: "Use $atrinik-issue-delivery to deliver the explicitly named Atrinik issue or existing PR through isolated work, review/fix cycles, current-head validation and checks, and an exact merge-ready handoff. You may claim an explicitly authorized issue, push ordinary branches, create draft PRs in issue mode, update selected or delivery-created PRs, mark drafts ready after exit conditions, and maintain one coordinate-bound selected-PR delivery comment; keep issue comments read-only and do not create placeholder issues, mutate incidental linked issues in PR mode, force-push, close, merge, self-approve, bypass policy, destructively reset, retarget, or apply cleanup."
policy:
  allow_implicit_invocation: false
