services:
  server:
    image: atrinik-server
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      ATRINIK_HTTP_URL: ${ATRINIK_HTTP_URL:-off}
      ATRINIK_CONNECTIVITY_MODE: ${ATRINIK_CONNECTIVITY_MODE:-direct_only}
      ATRINIK_SERVER_PUBLIC: ${ATRINIK_SERVER_PUBLIC:-false}
      ATRINIK_SERVER_HOST: ${ATRINIK_SERVER_HOST:-}
      ATRINIK_JOIN_PASSWORD: ${ATRINIK_JOIN_PASSWORD:-}
      HOME: /tmp
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "${ATRINIK_PORT:-1728}:1728"
      - "${ATRINIK_CRYPTO_PORT:-1729}:1729"
      - "${ATRINIK_QUIC_PORT:-1730}:1730/udp"
      - "${ATRINIK_HTTP_PORT:-8080}:8080"
    volumes:
      - ./server-data:/opt/atrinik/server/data
      - ./server-custom.cfg:/opt/atrinik/server/server-custom.cfg:ro
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
