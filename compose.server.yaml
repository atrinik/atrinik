services:
  server:
    image: atrinik-server
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      ATRINIK_HTTP_URL: ${ATRINIK_HTTP_URL:-off}
      ATRINIK_CONNECTIVITY_MODE: ${ATRINIK_CONNECTIVITY_MODE:-direct_only}
      ATRINIK_SERVER_PUBLIC: ${ATRINIK_SERVER_PUBLIC:-false}
      ATRINIK_SERVER_HOST: ${ATRINIK_SERVER_HOST:-}
      ATRINIK_JOIN_PASSWORD: ${ATRINIK_JOIN_PASSWORD:-}
      ATRINIK_JOIN_PASSWORD_FILE: ${ATRINIK_JOIN_PASSWORD_FILE:-/run/secrets/atrinik_join_password}
      ATRINIK_NETWORK_STACK: ${ATRINIK_NETWORK_STACK:-dual}
      ATRINIK_PORT_MAPPING: ${ATRINIK_PORT_MAPPING:-auto}
      ATRINIK_QUIC_PORT: ${ATRINIK_QUIC_PORT:-1730}
      HOME: /tmp
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./server-data:/opt/atrinik/server/data
      - ./server-custom.cfg:/opt/atrinik/server/server-custom.cfg:ro
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/atrinik-server-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
